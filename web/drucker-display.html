<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Ausleihe — Druckerwarteschlange</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <script src="/common.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    /* Seite fix im Viewport (Drucker-Display ist ein festes Bildschirmgerät,
       nicht zum Scrollen) — so bleibt die Warteschlangen-Karte mit allen Namen
       stets im sichtbaren Bereich; Überlauf wird ausgeblendet (s. Maske in
       drucker-display.js), nicht gescrollt. */
    html, body { height: 100%; overflow: hidden; }
    /* Theme-Variablen: dark = Default (bisheriges Aussehen), light = hell.
       --danger/--danger-text wie die Helfer-Statuszeile (host.css). */
    :root {
      --bg: #111; --text: #eee; --card: #1c1c1e; --card-border: #2c2c2e;
      --row-border: #1f1f21; --muted: #9a9a9e;
      --surface: #2c2c2e;
      --danger: #ff3b30; --danger-text: #ff6b6b;
    }
    [data-theme="light"] {
      --bg: #f5f5f7; --text: #1c1c1e; --card: #ffffff; --card-border: #e5e5ea;
      --row-border: #ececee; --muted: #6e6e73;
      --surface: #e9e9ee;
      --danger: #ff3b30; --danger-text: #d70015;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; padding: 24px;
    }
    h1 {
      font-size: 1.6rem; font-weight: 600; opacity: .85;
      margin-bottom: 16px; letter-spacing: .02em;
    }
    .section-label {
      font-size: 1.1rem; font-weight: 600; opacity: .55;
      margin: 18px 0 10px; text-transform: uppercase; letter-spacing: .08em;
    }
    .grid {
      display: grid; gap: 16px;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    }
    /* z-index: Drucker-Karten (2) über der Warteschlangen-Karte (1), damit ein
       Auftrag, der per FLIP von der Warteschlange in einen Drucker wandert (und
       dabei kurz über der Warteschlangen-Karte steht), VOR deren weißem Kasten
       malt — nicht dahinter. position:relative für z-index nötig. */
    .printer-card {
      background: var(--card); border-radius: 14px; padding: 20px 22px;
      border: 1px solid var(--card-border); min-width: 0;
      position: relative; z-index: 2;
      transition: transform .5s cubic-bezier(.22, .61, .36, 1);
    }
    /* Layout: Druckerkarten im Grid, darunter der Warteschlangen-Kasten
       (vollbreit, spannt alle Spalten). */
    .dd-layout { display: flex; flex-direction: column; gap: 16px; }
    .dd-waiting-card {
      background: var(--card); border-radius: 14px; padding: 20px 22px;
      border: 1px solid var(--card-border);
      position: relative; z-index: 1;
      transition: transform .5s cubic-bezier(.22, .61, .36, 1);
    }
    .dd-waiting-card .hint { margin-top: 4px; }
    .printer-name { font-size: 3rem; font-weight: 700; margin-bottom: 14px;
      overflow-wrap: anywhere; line-height: 1.1; }
    /* Kategorien „Gedruckt" / „Wird gedruckt" / „Nächster" unter dem Namen. */
    .dd-cat { margin-top: 18px; }
    /* Labels gleiten per FLIP nach, wenn eine Kategorie kollabiert (z. B. das
       „Gedruckt"-Kästchen nach TTL verschwindet → „Wird gedruckt"/„Nächster"
       rücken nach oben) — darum dieselbe transform-Transition wie die Karten. */
    .dd-cat-label { font-size: 1.5rem; font-weight: 600; opacity: .5;
      text-transform: uppercase; letter-spacing: .06em; margin-bottom: 10px;
      transition: transform .5s cubic-bezier(.22, .61, .36, 1); }
    /* Auftrags-Kästchen: eigenes kleines Panel wie der Drucker selbst eines
       ist. Grid mit fester Klassen-Spalte → Namen stehen bündig untereinander.
       FLIP-Transition (transform) wie die Bücherliste im Helferclient. */
    .dd-order {
      display: grid; grid-template-columns: 4em 1fr auto; gap: 10px;
      align-items: baseline;
      background: var(--surface); border: 1px solid var(--card-border);
      border-radius: 10px; padding: 10px 12px; margin-top: 8px;
      font-size: 1.6rem; line-height: 1.3; overflow-wrap: anywhere;
      position: relative; z-index: 1;
      transition: transform .5s cubic-bezier(.22, .61, .36, 1);
    }
    .dd-order:first-child { margin-top: 0; }
    .dd-form { color: var(--muted); font-weight: 600; }
    .dd-stname { color: var(--text); min-width: 0; }
    /* Auftraggeber rechts im Kästchen: Helfer (Person-Symbol + Name) bzw.
       Host (Laptop-Symbol). Bündig rechts, dezent (muted, etwas kleiner). */
    .dd-origin {
      justify-self: end; display: inline-flex; align-items: center;
      gap: 6px; color: var(--muted); font-size: 1.6rem; font-weight: 600;
      white-space: nowrap;
    }
    .dd-origin-kind { display: inline-flex; align-items: center; }
    .dd-ico { width: 1em; height: 1em; }
    .dd-origin-name { overflow-wrap: anywhere; }
    @media (prefers-reduced-motion: reduce) {
      .dd-order, .printer-card, .dd-waiting-card, .dd-cat-label { transition: transform .01ms !important; }
    }
    /* Druckerfehler: Name + „ - Fehler" rot in Namensgröße, darunter der
       Betreuer-Hinweis. Die Auftrags-Kategorien bleiben sichtbar, die Namen
       behalten ihre normale Farbe. */
    .printer-name.dd-fault-name { color: var(--danger); }
    /* Fehler-Hinweis in derselben Schriftgröße wie die Kategorie-Labels
       („Gedruckt"/„Wird gedruckt"/„Nächster"), nur in Rot. */
    .dd-fault-msg { color: var(--danger); font-size: 1.5rem; line-height: 1.3;
      margin-bottom: 16px; overflow-wrap: anywhere; }
    .txt-danger { color: var(--danger); }

    table { width: 100%; border-collapse: collapse; font-size: 1.05rem; }
    th { text-align: left; opacity: .5; font-weight: 600; padding: 8px 10px;
         border-bottom: 1px solid var(--card-border); }
    td { padding: 10px; border-bottom: 1px solid var(--row-border); vertical-align: top; }
    .pq-pos { color: var(--muted); width: 40px; text-align: right; font-variant-numeric: tabular-nums; }

    .hint { opacity: .5; font-size: 1.1rem; margin: 8px 0; }

    /* Registrierung (vor Pairing) — nur die Nummer, keine Schülerdaten. */
    #view-register { display: none; flex-direction: column; align-items: center;
      justify-content: center; min-height: 90vh; text-align: center; }
    #view-register.show { display: flex; }
    .reg-headline { font-size: 2rem; font-weight: 600; margin-bottom: 20px; }
    .reg-code {
      font-size: 6rem; font-weight: 700; letter-spacing: .3em;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      background: var(--card); border: 1px solid var(--card-border); border-radius: 20px;
      padding: 24px 48px; margin: 12px 0;
    }
    .reg-sub { font-size: 1.3rem; opacity: .55; margin-top: 16px; }

    /* Gesperrt (× am Host) — Display wurde vom Betreuer verboten. */
    #view-forbidden { display: none; flex-direction: column; align-items: center;
      justify-content: center; min-height: 90vh; text-align: center; }
    #view-forbidden.show { display: flex; }
    .forbidden-headline { font-size: 2rem; font-weight: 600; margin-bottom: 20px;
      color: var(--danger-text); }
    .forbidden-sub { font-size: 1.3rem; opacity: .55; margin-top: 16px; }

    #view-queue { display: none; }
    #view-queue.show { display: block; }

    #conn { position: fixed; bottom: 14px; right: 16px; font-size: .85rem; opacity: .55; }
    #dd-name { position: fixed; bottom: 14px; left: 18px; font-size: .85rem; opacity: .55; }
  </style>
</head>
<body>
  <div id="dd-name"></div>
  <div id="conn"><span class="dot" id="conn-dot" style="background:#888"></span><span id="conn-text">verbinde…</span></div>

  <!-- Registrierung (vor Pairing am Host) — zeigt NUR die Nummer. -->
  <div id="view-register">
    <div class="reg-headline">Drucker-Display registrieren</div>
    <div class="reg-code" id="reg-code">····</div>
    <p class="reg-sub">Am Host diesen Reiter wählen und einen Namen eingeben, um das Display freizuschalten.</p>
  </div>

  <!-- Gesperrt: Display wurde vom Betreuer per × verboten (endgültig). -->
  <div id="view-forbidden">
    <div class="forbidden-headline">Dieses Display wurde vom Betreuer gesperrt.</div>
    <p class="forbidden-sub">Bitte wende dich an den Betreuer.</p>
  </div>

  <!-- Warteschlange (nach Pairing + Zuweisung) -->
  <div id="view-queue">
    <div id="dd-content"></div>
  </div>

  <script src="/drucker-display.js"></script>
</body>
</html>
